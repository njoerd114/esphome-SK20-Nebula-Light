# Local development build.
#
# `recommended_base.yaml` pulls the package files from this repository over the
# network (ref: master), so local edits do not take effect until they are pushed.
# Compile this file instead while testing: it includes the working-copy package
# files directly. It is not the distribution entry point.

substitutions:
  device_name: "Star Projector"

esphome:
  name: "nebula"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  ap:
    ssid: "Fallback AP"
    password: !secret wifi_fallback_password

logger:
  level: INFO

ota:
  - platform: esphome
    encryption:
      key: !secret api_key

web_server:
  port: 80
  ota: false

api:
  encryption:
    key: !secret api_key

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${device_name} IP Address"
    ssid:
      name: "${device_name} Wifi SSID"
    mac_address:
      name: "${device_name} MAC Address"

sensor:
  - platform: uptime
    name: "${device_name} Uptime"
    unit_of_measurement: min
    filters:
      - lambda: return x / 60.0;
  - platform: wifi_signal
    name: "${device_name} Wifi Signal"
    update_interval: 60s

packages:
  platform: !include platform_bk72xx.yaml
  device: !include nebula_light_device.yaml
